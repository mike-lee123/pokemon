<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寶可夢冒險</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#ffffff; --ink:#1f2328; --muted:#6b7078; --line:#dcdcdc;
  --red:#e3350d; --red-ink:#fff; --btn:#eef0f3; --btn-ink:#1f2328; --log:#fbfbfb;
  --new:rgba(255,205,0,.32); --sky1:#bfe6ff; --sky2:#e8f7ff; --grass:#9fd67a;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15171c; --panel:#21252c; --ink:#e9eaec; --muted:#a3a8b0; --line:#373b44;
    --btn:#2d3139; --btn-ink:#e9eaec; --log:#1a1d22; --new:rgba(255,205,0,.18);
    --sky1:#23405a; --sky2:#2c3b4a; --grass:#3d6b33;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{margin:4px 0 12px;font-size:1.8rem}
h2{margin:8px 0 10px;font-size:1.25rem}
h3{margin:14px 0 8px;font-size:1rem}
.muted{color:var(--muted);font-size:.88rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap-row{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.stat b{display:block;font-size:1.2rem}
button{font:inherit;border:1px solid var(--line);background:var(--btn);color:var(--btn-ink);
  border-radius:8px;padding:8px 10px;cursor:pointer;transition:transform .05s,filter .15s}
button:hover:not(:disabled){filter:brightness(.95)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--red);color:var(--red-ink);border-color:var(--red)}
button.full{width:100%}
.move{text-align:left;border-left:6px solid var(--tc);background:var(--panel)}
.move small{display:block;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
.tb{color:#fff;padding:1px 8px;border-radius:10px;font-size:.75rem;margin-right:4px;
  text-shadow:0 1px 1px rgba(0,0,0,.45);white-space:nowrap}
.hpwrap{background:#cfcfcf;border-radius:6px;height:10px;overflow:hidden;margin:4px 0 2px}
.hpfill{height:100%;border-radius:6px;transition:width .5s ease}
.xpwrap{background:#cfcfcf;border-radius:4px;height:5px;overflow:hidden;margin-top:4px}
.xpfill{height:100%;background:#3fa9f5;transition:width .5s}
.arena{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:4px 10px;
  border-radius:14px;padding:12px;margin-bottom:12px;
  background:linear-gradient(var(--sky1),var(--sky2) 55%,var(--grass) 56%)}
.arena .card{background:var(--panel);border-radius:10px;padding:8px 10px;align-self:center;
  box-shadow:0 2px 6px rgba(0,0,0,.12)}
.sprite{width:100%;max-width:150px;justify-self:center;image-rendering:pixelated;transition:opacity .4s,transform .4s}
.sprite.hit{animation:shake .4s}
.sprite.fainted{opacity:.15;transform:translateY(20px)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.log{background:var(--log);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:8px;
  padding:8px 12px;min-height:120px}
.log div{padding:0 4px;border-radius:4px}
.log .new{background:var(--new)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.dex .panel{text-align:center;padding:8px;margin:0}
.dex img,.dex .unk{width:72px;height:72px}
.dex .unk{display:inline-flex;align-items:center;justify-content:center;font-size:2.2rem}
.starter{text-align:center}
.starter img{width:96px;height:96px}
input[type=text]{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);width:100%;max-width:280px}
.mute{position:fixed;top:10px;right:10px;z-index:10;padding:6px 10px;font-size:.85rem;background:var(--panel);
  box-shadow:0 2px 6px rgba(0,0,0,.15)}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:9;max-width:calc(100% - 32px)}
.toast{background:#222;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);
  animation:fadein .2s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
.footer{margin-top:20px;text-align:center}
@media (max-width:560px){
  .grid4{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:1fr 1fr 1fr}
  .stat b{font-size:1rem}
  h1{font-size:1.5rem}
}
</style>
</head>

const SHOP_DESC = {"精靈球":"基本的捕捉道具","超級球":"捕捉率 ×1.5","高級球":"捕捉率 ×2",
  "傷藥":"回復 50 HP","全滿藥":"HP 全滿","活力碎片":"讓倒下的寶可夢復活（一半 HP）"};
const BALLS = {"精靈球":1,"超級球":1.5,"高級球":2,"大師球":0};

/* ---------------------------- 工具函式 ---------------------------- */
const randint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function weighted(pairs) {
  let r = Math.random() * pairs.reduce((s, p) => s + p[1], 0);
  for (const [v, w] of pairs) if ((r -= w) < 0) return v;
  return pairs[pairs.length - 1][0];
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bold = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

/* ---------------------------- 音效（Web Audio 即時合成，不需要音檔） ---------------------------- */
const MUTE_KEY = "pokemon-adventure-muted";
let muted = false;
try { muted = localStorage.getItem(MUTE_KEY) === "1"; } catch (e) { /* 忽略 */ }
let actx = null, sfxAt = 0;

function audio() {
  if (!actx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    actx = new Ctx();
  }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
// 單音：t 為相對於本音效開始的秒數，to 為滑音的結束頻率
function tone(t, freq, dur, {type = "square", vol = 0.1, to = null} = {}) {
  const o = actx.createOscillator(), g = actx.createGain(), at = sfxAt + t;
  o.type = type;
  o.frequency.setValueAtTime(freq, at);
  if (to) o.frequency.exponentialRampToValueAtTime(to, at + dur);
  g.gain.setValueAtTime(vol, at);
  g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  o.connect(g).connect(actx.destination);
  o.start(at); o.stop(at + dur + 0.02);
}
// 噪音（打擊、風聲）
function noise(t, dur, {vol = 0.25, freq = 1200, q = 1} = {}) {
  const len = Math.ceil(actx.sampleRate * dur), buf = actx.createBuffer(1, len, actx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(), at = sfxAt + t;
  src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, at);
  g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  src.connect(f).connect(g).connect(actx.destination);
  src.start(at);
}
const melody = (freqs, step, opt) => freqs.forEach((f, i) => tone(i * step, f, step * 1.6, opt));
const NOTE = {C4:262,D4:294,E4:330,F4:349,G4:392,Ab4:415,A4:440,Bb4:466,B4:494,C5:523,D5:587,E5:659,
              G5:784,A5:880,B5:988,C6:1047,E6:1319,G6:1568};

// 每個音效回傳長度（秒）；同一回合的多個音效會依序排隊播放
const SOUNDS = {
  click:     () => { tone(0, 1200, 0.04, {vol: 0.04}); return 0.04; },
  encounter: () => { for (let k = 0; k < 6; k++) tone(k * 0.07, k % 2 ? NOTE.A5 : NOTE.E5, 0.07, {vol: 0.07}); return 0.45; },
  trainer:   () => { melody([NOTE.C5, NOTE.E5, NOTE.G5, NOTE.C6, NOTE.G5, NOTE.C6], 0.09, {vol: 0.08}); return 0.6; },
  attack:    () => { noise(0, 0.12, {freq: 2500, vol: 0.15}); return 0.12; },
  hit:       () => { noise(0, 0.15, {freq: 800, vol: 0.35}); tone(0, 180, 0.15, {to: 60, vol: 0.14}); return 0.2; },
  superHit:  () => { noise(0, 0.2, {freq: 600, vol: 0.45}); tone(0, 220, 0.25, {to: 50, vol: 0.18});
                     noise(0.1, 0.15, {freq: 1500, vol: 0.3}); return 0.3; },
  weakHit:   () => { noise(0, 0.08, {freq: 400, vol: 0.15}); return 0.12; },
  miss:      () => { tone(0, 700, 0.2, {type: "sine", to: 200, vol: 0.1}); return 0.22; },
  crit:      () => { tone(0, NOTE.E6, 0.12, {type: "triangle", vol: 0.12}); tone(0.06, NOTE.G6, 0.15, {type: "triangle", vol: 0.1}); return 0.2; },
  faint:     () => { tone(0, 500, 0.7, {to: 60, vol: 0.11}); return 0.75; },
  levelup:   () => { melody([NOTE.C5, NOTE.E5, NOTE.G5, NOTE.C6], 0.08, {vol: 0.08}); return 0.45; },
  learn:     () => { melody([NOTE.G5, NOTE.C6], 0.08, {type: "triangle", vol: 0.1}); return 0.2; },
  evolve:    () => { melody([NOTE.C5, NOTE.D5, NOTE.E5, NOTE.G5, NOTE.A5, NOTE.C6, NOTE.E6, NOTE.G6], 0.09,
                            {type: "triangle", vol: 0.12}); return 0.9; },
  throw:     () => { tone(0, 300, 0.18, {type: "sine", to: 900, vol: 0.1}); return 0.2; },
  shake:     () => { [0, 0.3, 0.6].forEach(t => { tone(t, 180, 0.06, {vol: 0.09}); noise(t, 0.05, {freq: 3000, vol: 0.1}); }); return 0.8; },
  caught:    () => { melody([NOTE.G4, NOTE.C5, NOTE.E5, NOTE.G5, NOTE.E5, NOTE.G5, NOTE.C6], 0.09, {vol: 0.08}); return 0.8; },
  breakFree: () => { noise(0, 0.1, {freq: 2000, vol: 0.3}); tone(0, 600, 0.15, {to: 150, vol: 0.1}); return 0.2; },
  heal:      () => { melody([NOTE.C5, NOTE.E5, NOTE.G5, NOTE.C6, NOTE.E6], 0.1, {type: "sine", vol: 0.12}); return 0.65; },
  buy:       () => { tone(0, NOTE.B5, 0.08, {vol: 0.07}); tone(0.08, NOTE.E6, 0.3, {vol: 0.07}); return 0.4; },
  error:     () => { tone(0, 150, 0.15, {vol: 0.09}); tone(0.17, 150, 0.15, {vol: 0.09}); return 0.35; },
  switchMon: () => { tone(0, NOTE.G4, 0.08, {vol: 0.08}); tone(0.08, NOTE.C5, 0.1, {vol: 0.08}); return 0.2; },
  run:       () => { noise(0, 0.3, {freq: 1500, vol: 0.15, q: 0.5}); tone(0, 400, 0.3, {type: "sine", to: 1200, vol: 0.06}); return 0.3; },
  win:       () => { melody([NOTE.C5, NOTE.E5, NOTE.G5, NOTE.C6, NOTE.G5, NOTE.C6], 0.11, {vol: 0.08}); return 0.8; },
  badge:     () => { melody([NOTE.C5, NOTE.C5, NOTE.C5, NOTE.C5, NOTE.Ab4, NOTE.Bb4, NOTE.C5, NOTE.Bb4, NOTE.C5], 0.12,
                            {vol: 0.09}); return 1.2; },
  lose:      () => { melody([NOTE.G4, NOTE.F4, NOTE.E4, NOTE.D4, NOTE.C4], 0.15, {type: "triangle", vol: 0.12}); return 0.9; },
};

function sfx(name) {
  if (muted || !SOUNDS[name]) return;
  try {
    const c = audio();
    if (!c) return;
    sfxAt = Math.max(sfxAt, c.currentTime + 0.01);
    sfxAt += SOUNDS[name]() + 0.05;
  } catch (e) { /* 瀏覽器不支援時安靜略過 */ }
}

/* ---------------------------- 遊戲狀態 ---------------------------- */
function freshState() {
  return {started:false, player:"", money:3000, badges:0, party:[], box:[],
    bag:{"精靈球":5,"超級球":0,"高級球":0,"大師球":0,"傷藥":3,"全滿藥":0,"活力碎片":0},
    seen:[], caught:[], battle:null};
}
let G = loadSaved();
let tab = "explore";

function loadSaved() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.party)) return Object.assign(freshState(), d);
    }
  } catch (e) { /* 無痕模式或被封鎖時忽略 */ }
  return freshState();
}
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) { /* 忽略 */ }
}

/* ---------------------------- 寶可夢邏輯 ---------------------------- */
const nm = m => SPECIES[m.sid].name;
const tp = m => SPECIES[m.sid].types;

function stats(m) {
  const [hp, atk, df, spd] = SPECIES[m.sid].base, L = m.lvl;
  return {hp: Math.floor(hp * 2 * L / 100) + L + 10, atk: Math.floor(atk * 2 * L / 100) + 5,
          def: Math.floor(df * 2 * L / 100) + 5, spd: Math.floor(spd * 2 * L / 100) + 5};
}
const xpNeed = lvl => 8 * lvl + 20;

function effectiveness(mtype, defTypes) {
  let mult = 1;
  for (const t of defTypes) { const v = (TYPE_CHART[mtype] || {})[t]; if (v !== undefined) mult *= v; }
  return mult;
}

function newMon(sid, lvl) {
  const moves = [];
  for (const [l, mv] of SPECIES[sid].learn) if (l <= lvl && !moves.includes(mv)) moves.push(mv);
  const m = {sid, lvl, xp: 0, moves: moves.slice(-4)};
  m.hp = stats(m).hp;
  return m;
}

function register(sid, caught = false) {
  if (!G.seen.includes(sid)) G.seen.push(sid);
  if (caught && !G.caught.includes(sid)) G.caught.push(sid);
}

function log(msg) {
  if (G.battle) G.battle.log.push(msg); else toast(msg);
}

function learnMoves(m) {
  for (const [l, mv] of SPECIES[m.sid].learn) {
    if (l !== m.lvl || m.moves.includes(mv)) continue;
    if (m.moves.length < 4) {
      m.moves.push(mv);
      sfx("learn");
      log(`📘 ${nm(m)} 學會了 **${mv}**！`);
    } else {
      const weakest = m.moves.reduce((a, b) => MOVES[b][1] < MOVES[a][1] ? b : a);
      if (MOVES[mv][1] > MOVES[weakest][1]) {
        m.moves[m.moves.indexOf(weakest)] = mv;
        sfx("learn");
        log(`📘 ${nm(m)} 忘記了 ${weakest}，學會了 **${mv}**！`);
      }
    }
  }
}

function checkEvo(m) {
  const evo = SPECIES[m.sid].evo;
  if (evo && m.lvl >= evo[0]) {
    const oldName = nm(m), oldMax = stats(m).hp;
    m.sid = evo[1];
    m.hp += stats(m).hp - oldMax;
    sfx("evolve");
    log(`✨ 咦？${oldName} 進化成了 **${nm(m)}**！`);
    register(m.sid, true);
    learnMoves(m);
  }
}

function gainXp(m, amount) {
  m.xp += amount;
  while (m.lvl < 100 && m.xp >= xpNeed(m.lvl)) {
    m.xp -= xpNeed(m.lvl);
    const oldMax = stats(m).hp;
    m.lvl += 1;
    m.hp += stats(m).hp - oldMax;
    sfx("levelup");
    log(`⬆️ ${nm(m)} 升到了 Lv.${m.lvl}！`);
    learnMoves(m);
    checkEvo(m);
  }
}

function healAll() { for (const m of [...G.party, ...G.box]) m.hp = stats(m).hp; }
function firstAlive() { const i = G.party.findIndex(m => m.hp > 0); return i < 0 ? null : i; }

// 使用回復道具，成功回傳訊息，無效回傳 null
function applyHeal(m, item) {
  const mx = stats(m).hp;
  if (item === "活力碎片") {
    if (m.hp > 0) return null;
    m.hp = Math.floor(mx / 2);
    return `${nm(m)} 恢復了意識！`;
  }
  if (m.hp <= 0 || m.hp >= mx) return null;
  const before = m.hp;
  m.hp = item === "全滿藥" ? mx : Math.min(mx, m.hp + 50);
  return `${nm(m)} 回復了 ${m.hp - before} HP。`;
}

/* ---------------------------- 戰鬥 ---------------------------- */
const foe = () => G.battle.enemies[G.battle.ei];
const me = () => G.party[G.battle.active];
const foePrefix = () => G.battle.kind === "wild" ? "野生的" : `${G.battle.leader}的`;

function calcDamage(att, dfn, move) {
  const [mtype, power, acc] = MOVES[move];
  if (randint(1, 100) > acc) return null;
  const a = stats(att).atk, d = stats(dfn).def;
  const base = ((2 * att.lvl / 5 + 2) * power * a / d) / 50 + 2;
  const stab = tp(att).includes(mtype) ? 1.5 : 1;
  const eff = effectiveness(mtype, tp(dfn));
  const crit = Math.random() < 1 / 16;
  let dmg = Math.floor(base * stab * eff * (crit ? 1.5 : 1) * (0.85 + Math.random() * 0.15));
  if (eff > 0) dmg = Math.max(1, dmg);
  return {dmg, eff, crit};
}

function attack(att, dfn, move, isPlayer) {
  log(`${isPlayer ? "我方的" : foePrefix()} ${nm(att)} 使用了 **${move}**！`);
  const res = calcDamage(att, dfn, move);
  sfx("attack");
  if (!res) { sfx("miss"); log("但是沒有命中！"); return; }
  if (res.eff === 0) { sfx("miss"); log(`對 ${nm(dfn)} 好像沒有效果……`); return; }
  dfn.hp = Math.max(0, dfn.hp - res.dmg);
  G.battle.anim[isPlayer ? "foe" : "me"] = true;
  sfx(res.eff > 1 ? "superHit" : res.eff < 1 ? "weakHit" : "hit");
  if (res.crit) { sfx("crit"); log("💥 擊中要害！"); }
  if (res.eff > 1) log("🔥 效果絕佳！");
  else if (res.eff < 1) log("效果不太好……");
  log(`造成了 ${res.dmg} 點傷害。`);
}

function enemyChoose(f, m) {
  if (Math.random() < 0.6) {
    const score = mv => { const [t, p] = MOVES[mv]; return p * effectiveness(t, tp(m)) * (tp(f).includes(t) ? 1.5 : 1); };
    return f.moves.reduce((a, b) => score(b) > score(a) ? b : a);
  }
  return pick(f.moves);
}

function startBattle(kind, enemies, intro, leader = null, gym = null) {
  G.battle = {kind, enemies, ei: 0, active: firstAlive(), log: [intro], shown: 0,
              mustSwitch: false, over: false, result: null, leader, gym, anim: {foe: false, me: false}};
  sfx(kind === "wild" ? "encounter" : "trainer");
  register(enemies[0].sid);
  log(`上吧！${nm(me())}！`);
}

function resolve() {
  if (foe().hp <= 0) enemyFainted();
  else if (me().hp <= 0) playerFainted();
}

function enemyTurn() {
  const f = foe(), m = me();
  attack(f, m, enemyChoose(f, m), false);
  resolve();
}

function enemyFainted() {
  const b = G.battle, f = foe(), m = me();
  sfx("faint");
  log(`${foePrefix()} ${nm(f)} 倒下了！`);
  const baseSum = SPECIES[f.sid].base.reduce((a, c) => a + c, 0);
  const gain = Math.floor(Math.floor(baseSum / 3) * f.lvl / 7 * (b.kind === "trainer" ? 1.5 : 1));
  log(`${nm(m)} 獲得了 ${gain} 點經驗值。`);
  gainXp(m, gain);
  const share = Math.floor(gain * 3 / 10);
  const others = G.party.filter((o, j) => j !== b.active && o.hp > 0);
  if (others.length && share > 0) {
    log(`其他隊員透過學習裝置各獲得了 ${share} 點經驗值。`);
    for (const o of others) gainXp(o, share);
  }
  if (b.ei + 1 < b.enemies.length) {
    b.ei += 1;
    register(foe().sid);
    log(`${b.leader} 派出了 **${nm(foe())}** (Lv.${foe().lvl})！`);
  } else {
    win();
  }
}

function win() {
  const b = G.battle;
  b.over = true; b.result = "win";
  if (b.kind === "wild") {
    const money = b.enemies[b.enemies.length - 1].lvl * 10;
    G.money += money;
    sfx("win");
    log(`💰 撿到了 ${money} 元。`);
    return;
  }
  const gym = GYMS[b.gym];
  G.money += gym.reward;
  sfx(G.badges === b.gym ? "badge" : "win");
  log(`🏆 你打敗了 ${gym.leader}！獲得 ${gym.reward} 元。`);
  if (G.badges === b.gym) {
    G.badges += 1;
    log(`🎖️ 獲得了 **${gym.badge}**！`);
    if (b.gym === GYMS.length - 1) {
      G.bag["大師球"] = (G.bag["大師球"] || 0) + 1;
      log("🎁 獲得了 **大師球** ×1！");
      log("🎉🎉 恭喜你成為寶可夢聯盟冠軍！「未知洞窟」已經開放！");
    }
  }
}

function playerFainted() {
  const b = G.battle;
  sfx("faint");
  log(`我方的 ${nm(me())} 倒下了！`);
  if (firstAlive() !== null) {
    b.mustSwitch = true;
    log("請選擇下一隻寶可夢！");
  } else {
    const lost = Math.floor(G.money / 2);
    G.money -= lost;
    sfx("lose");
    log(`💀 你的寶可夢全部倒下了……慌亂中掉了 ${lost} 元，被送回了寶可夢中心。`);
    healAll();
    b.over = true; b.result = "lose";
  }
}

/* ---------------------------- 玩家動作 ---------------------------- */
const A = {
  start(sid) {
    G.player = (document.getElementById("nameInput").value || "").trim().slice(0, 12) || "小智";
    G.party = [newMon(sid, 5)];
    register(sid, true);
    sfx("caught");
    G.started = true;
    tab = "explore";
    toast(`你選擇了 ${SPECIES[sid].name}！冒險開始！`);
  },
  tab(t) { tab = t; },
  mute() {
    muted = !muted;
    try { localStorage.setItem(MUTE_KEY, muted ? "1" : "0"); } catch (e) { /* 忽略 */ }
  },

  wild(i) {
    if (firstAlive() === null) { toast("你的寶可夢都倒下了，先去寶可夢中心吧！"); return; }
    const area = AREAS[i];
    const sid = weighted(area.mons), lvl = randint(area.lv[0], area.lv[1]);
    startBattle("wild", [newMon(sid, lvl)], `野生的 **${SPECIES[sid].name}** (Lv.${lvl}) 跳出來了！`);
  },
  gym(i) {
    if (firstAlive() === null) { toast("你的寶可夢都倒下了，先去寶可夢中心吧！"); return; }
    const gym = GYMS[i];
    const enemies = gym.team.map(([sid, lv]) => newMon(sid, lv));
    startBattle("trainer", enemies,
      `**${gym.leader}** 向你發起挑戰！${gym.leader} 派出了 **${nm(enemies[0])}** (Lv.${enemies[0].lvl})！`,
      gym.leader, i);
  },

  move(i) {
    const m = me(), f = foe();
    const mv = m.moves[i], fmv = enemyChoose(f, m);
    const ms = stats(m).spd, fs = stats(f).spd;
    if (ms > fs || (ms === fs && Math.random() < 0.5)) {
      attack(m, f, mv, true);
      if (f.hp > 0) attack(f, m, fmv, false);
    } else {
      attack(f, m, fmv, false);
      if (m.hp > 0) attack(m, f, mv, true);
    }
    resolve();
  },
  ball(ball) {
    const b = G.battle, f = foe();
    if (b.kind !== "wild" || (G.bag[ball] || 0) <= 0) return;
    G.bag[ball] -= 1;
    sfx("throw"); sfx("shake");
    log(`你丟出了 ${ball}！`);
    let p = 1;
    if (ball !== "大師球") {
      const mx = stats(f).hp;
      p = Math.min(1, (3 * mx - 2 * f.hp) * SPECIES[f.sid].capture * BALLS[ball] / (3 * mx) / 255);
    }
    if (Math.random() < p) {
      sfx("caught");
      log(`🎉 抓到了 **${nm(f)}**！`);
      register(f.sid, true);
      if (G.party.length < 6) G.party.push(f);
      else { G.box.push(f); log("隊伍已滿，已傳送到電腦箱。"); }
      b.over = true; b.result = "catch";
    } else {
      sfx("breakFree");
      log(pick(["哎呀！寶可夢掙脫了！", "可惡！差一點就抓到了！", "看起來快要抓到了……"]));
      enemyTurn();
    }
  },
  item(item) {
    if ((G.bag[item] || 0) <= 0) return;
    const msg = applyHeal(me(), item);
    if (!msg) { sfx("error"); log(`現在使用 ${item} 不會有效果。`); return; }
    G.bag[item] -= 1;
    sfx("heal");
    log(`使用了 ${item}，${msg}`);
    enemyTurn();
  },
  sw(i) {
    const b = G.battle;
    if (i === b.active || G.party[i].hp <= 0) return;
    if (b.mustSwitch) {
      b.active = i; b.mustSwitch = false;
      sfx("switchMon");
      log(`上吧！${nm(me())}！`);
    } else {
      sfx("switchMon");
      log(`回來吧，${nm(me())}！上吧，${nm(G.party[i])}！`);
      b.active = i;
      enemyTurn();
    }
  },
  run() {
    const b = G.battle;
    if (b.kind !== "wild") { log("不能從訓練家對戰中逃跑！"); return; }
    if (stats(me()).spd >= stats(foe()).spd || Math.random() < 0.5) {
      sfx("run"); log("順利逃走了！"); b.over = true; b.result = "run";
    } else {
      sfx("error"); log("逃跑失敗！"); enemyTurn();
    }
  },
  leave() { G.battle = null; },

  heal() { healAll(); sfx("heal"); toast("👩‍⚕️ 你的寶可夢都恢復健康了！歡迎再來！"); },
  buy(item, qty) {
    const cost = SHOP[item] * qty;
    if (G.money < cost) { sfx("error"); toast("錢不夠喔！"); return; }
    G.money -= cost;
    G.bag[item] = (G.bag[item] || 0) + qty;
    sfx("buy");
    toast(`買了 ${item} ×${qty}`);
  },
  lead(i) { G.party.unshift(G.party.splice(i, 1)[0]); },
  dep(i) { if (G.party.length > 1) G.box.push(G.party.splice(i, 1)[0]); },
  wd(i) { if (G.party.length < 6) G.party.push(G.box.splice(i, 1)[0]); },
  rel(i) {
    if (!confirm(`確定要放生 ${nm(G.box[i])} 嗎？`)) return;
    toast(`你放生了 ${nm(G.box.splice(i, 1)[0])}，再見了！`);
  },
  use(item, i) {
    const msg = applyHeal(G.party[i], item);
    if (!msg) { sfx("error"); toast(`現在使用 ${item} 不會有效果。`); return; }
    G.bag[item] -= 1;
    sfx("heal");
    toast(msg);
  },
  exportSave() {
    const blob = new Blob([JSON.stringify(G, null, 1)], {type: "application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `pokemon_save_${G.player || "trainer"}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  importSave() { document.getElementById("fileInput").click(); },
  reset() {
    if (!confirm("確定要刪除目前進度、重新開始嗎？")) return;
    G = freshState(); tab = "explore";
  },
};

document.getElementById("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!d || !Array.isArray(d.party)) throw new Error("bad");
      G = Object.assign(freshState(), d, {battle: null});
      toast("讀檔成功！");
    } catch (err) {
      toast("存檔檔案格式錯誤。");
    }
    e.target.value = "";
    render();
  };
  reader.readAsText(file);
});

// 這些動作會自己播放音效，其餘按鈕播放一般點擊聲
const SELF_SOUND = new Set(["start", "wild", "gym", "move", "ball", "item", "sw", "run", "heal", "buy", "use"]);
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const args = el.dataset.arg ? JSON.parse(el.dataset.arg) : [];
  if (!SELF_SOUND.has(el.dataset.act)) sfx("click");
  A[el.dataset.act](...args);
  render();
});

// 戰鬥中可用數字鍵 1–4 出招
document.addEventListener("keydown", e => {
  const b = G.battle;
  if (!b || b.over || b.mustSwitch || e.target.tagName === "INPUT") return;
  const i = Number(e.key) - 1;
  if (i >= 0 && i < me().moves.length) { A.move(i); render(); }
});

/* ---------------------------- 畫面 ---------------------------- */
function toast(msg) {
  const box = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = bold(esc(msg));
  box.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function btn(label, act, args = [], {cls = "", disabled = false, style = ""} = {}) {
  return `<button class="${cls}" data-act="${act}" data-arg='${JSON.stringify(args)}'` +
         `${disabled ? " disabled" : ""}${style ? ` style="${style}"` : ""}>${label}</button>`;
}
const img = (src, cls = "", w = "") =>
  `<img class="${cls}" src="${src}" alt="" ${w ? `width="${w}" height="${w}"` : ""} loading="lazy" onerror="this.onerror=null;this.src='${FALLBACK_IMG}'">`;
const typeBadges = ts => ts.map(t => `<span class="tb" style="background:${TYPE_COLOR[t]}">${t}</span>`).join("");

function hpBar(m) {
  const mx = stats(m).hp, pct = mx ? m.hp / mx * 100 : 0;
  const color = pct > 50 ? "#4caf50" : pct > 20 ? "#ffc107" : "#f44336";
  return `<div class="hpwrap"><div class="hpfill" style="width:${pct.toFixed(0)}%;background:${color}"></div></div>` +
         `<div class="muted">HP ${m.hp} / ${mx}</div>`;
}
const monHeader = m => `<b>${nm(m)}</b>&nbsp; Lv.${m.lvl}<br>${typeBadges(tp(m))}${hpBar(m)}`;

function render() {
  document.getElementById("muteBtn").textContent = muted ? "🔇 音效關" : "🔊 音效開";
  if (!G.started) renderStart();
  else if (G.battle) renderBattle();
  else renderMap();
  save();
}

function renderStart() {
  let h = `<h1>⚡ 寶可夢冒險</h1>
    <div class="panel">
      <p>歡迎來到寶可夢的世界！我是大木博士。首先，請告訴我你的名字。</p>
      <input type="text" id="nameInput" maxlength="12" placeholder="小智">
      <p>接著，從下面挑選你的第一隻寶可夢吧！</p>
      <div class="grid4">`;
  for (const sid of STARTERS) {
    const s = SPECIES[sid];
    h += `<div class="panel starter">${img(SPRITE(sid), "", 96)}<div><b>${s.name}</b></div>
          <div>${typeBadges(s.types)}</div><div style="margin-top:8px">${btn("就決定是你了！", "start", [sid], {cls: "primary full"})}</div></div>`;
  }
  h += `</div></div>
    <div class="panel"><b>📂 已經有存檔？</b><p class="muted">可以讀取從其他電腦下載的存檔檔案。</p>${btn("讀取存檔檔案", "importSave")}</div>`;
  document.getElementById("app").innerHTML = h + footer();
}

function renderBattle() {
  const b = G.battle, f = foe(), m = me();
  const title = b.kind === "wild" ? "野生寶可夢對戰" : `🏟️ ${GYMS[b.gym].name} — ${b.leader}`;
  let h = `<h2>${title}</h2>`;
  if (b.kind === "trainer") {
    const left = b.enemies.length - b.ei;
    h += `<p class="muted">對手剩餘寶可夢：${"🔴".repeat(left)}${"⚫".repeat(b.enemies.length - left)}</p>`;
  }
  const fCls = f.hp <= 0 ? "fainted" : b.anim.foe ? "hit" : "";
  const mCls = m.hp <= 0 ? "fainted" : b.anim.me ? "hit" : "";
  const need = xpNeed(m.lvl);
  h += `<div class="arena">
      <div class="card">${monHeader(f)}</div>
      ${img(SPRITE(f.sid), "sprite " + fCls)}
      ${img(SPRITE_BACK(m.sid), "sprite " + mCls)}
      <div class="card">${monHeader(m)}
        <div class="xpwrap"><div class="xpfill" style="width:${Math.min(100, m.xp / need * 100).toFixed(0)}%"></div></div>
        <div class="muted">EXP ${m.xp} / ${need}</div></div>
    </div>`;
  b.anim = {foe: false, me: false};

  if (b.over) {
    const label = {win: "勝利！繼續冒險", catch: "太好了！繼續冒險", run: "繼續冒險", lose: "回到寶可夢中心"}[b.result];
    h += btn(label, "leave", [], {cls: "primary full"});
  } else if (b.mustSwitch) {
    h += `<h3>⚠️ 選擇下一隻上場的寶可夢：</h3>${switchButtons(b)}`;
  } else {
    h += `<h3>⚔️ 招式 <span class="muted">（點擊即攻擊，也可按數字鍵 1–4）</span></h3><div class="grid2">`;
    m.moves.forEach((mv, i) => {
      const [t, p, acc] = MOVES[mv];
      const eff = effectiveness(t, tp(f));
      const hint = eff > 1 ? " ⬆️效果絕佳" : eff === 0 ? " ✖️沒效果" : eff < 1 ? " ⬇️效果不好" : "";
      h += btn(`${i + 1}. <b>${mv}</b><small>${t}｜威力 ${p}｜命中 ${acc}${hint}</small>`, "move", [i],
               {cls: "move", style: `--tc:${TYPE_COLOR[t]}`});
    });
    h += `</div><h3>🎒 背包 <span class="muted">（數量 0 的道具無法使用）</span></h3>`;
    if (b.kind === "wild") {
      h += `<div class="grid4">` + Object.keys(BALLS).map(ball =>
        btn(`${ball} ×${G.bag[ball] || 0}`, "ball", [ball], {disabled: (G.bag[ball] || 0) <= 0})).join("") + `</div><div style="height:8px"></div>`;
    }
    h += `<div class="grid3">` + ["傷藥", "全滿藥"].map(item =>
      btn(`${item} ×${G.bag[item] || 0}`, "item", [item], {disabled: (G.bag[item] || 0) <= 0})).join("") +
      btn("🏃 逃跑", "run", [], {disabled: b.kind !== "wild"}) + `</div>`;
    if (G.party.length > 1) h += `<h3>🔄 換寶可夢 <span class="muted">（會被對手攻擊一次）</span></h3>${switchButtons(b)}`;
  }

  const lines = b.log.slice(-10);
  const newFrom = lines.length - (b.log.length - b.shown);
  h += `<h3>📜 戰鬥訊息</h3><div class="log">` +
       lines.map((l, k) => `<div class="${k >= newFrom ? "new" : ""}">${bold(l)}</div>`).join("") + `</div>`;
  b.shown = b.log.length;
  document.getElementById("app").innerHTML = h + footer();
}

function switchButtons(b) {
  return `<div class="grid3">` + G.party.map((p, i) =>
    btn(`${nm(p)} Lv.${p.lvl}<br><span class="muted">${p.hp}/${stats(p).hp}</span>`, "sw", [i],
        {disabled: i === b.active || p.hp <= 0})).join("") + `</div>`;
}

const TABS = [["explore","🗺️ 探索"],["gym","🏟️ 道館"],["center","🏥 中心"],["shop","🛒 商店"],
              ["party","🎒 隊伍"],["box","💻 電腦"],["dex","📖 圖鑑"],["save","💾 存檔"]];

function renderMap() {
  let h = `<h1>⚡ 寶可夢冒險</h1>
    <div class="stats">
      <div class="stat"><span class="muted">訓練家</span><b>${esc(G.player)}</b></div>
      <div class="stat"><span class="muted">金錢</span><b>₽${G.money.toLocaleString()}</b></div>
      <div class="stat"><span class="muted">徽章</span><b>${"🎖️".repeat(G.badges) || "—"} ${G.badges}/${GYMS.length}</b></div>
    </div>
    <div class="tabs">${TABS.map(([k, label]) => btn(label, "tab", [k], {cls: tab === k ? "on" : ""})).join("")}</div>`;
  h += ({explore: viewExplore, gym: viewGyms, center: viewCenter, shop: viewShop,
         party: viewParty, box: viewBox, dex: viewDex, save: viewSave})[tab]();
  document.getElementById("app").innerHTML = h + footer();
}

function viewExplore() {
  let h = firstAlive() === null ? `<div class="panel" style="border-color:#f44336">⚠️ 你的寶可夢都倒下了，請先到寶可夢中心！</div>` : "";
  AREAS.forEach((a, i) => {
    const locked = G.badges < a.req;
    h += `<div class="panel row"><div class="grow"><b>${a.name}</b>&nbsp; Lv.${a.lv[0]}–${a.lv[1]}<div class="muted">${a.desc}</div></div>
      ${locked ? btn(`🔒 需 ${a.req} 枚徽章`, "wild", [i], {disabled: true}) : btn("走進草叢", "wild", [i], {cls: "primary"})}</div>`;
  });
  return h;
}

function viewGyms() {
  return GYMS.map((g, i) => {
    const team = g.team.map(([s, lv]) => `${G.seen.includes(s) ? SPECIES[s].name : "???"} Lv.${lv}`).join("、");
    const done = G.badges > i;
    const action = G.badges < i ? btn("🔒 未解鎖", "gym", [i], {disabled: true})
                 : btn(done ? "再戰" : "挑戰！", "gym", [i], {cls: done ? "" : "primary"});
    return `<div class="panel row"><div class="grow">${done ? "✅ " : ""}<b>${g.name}</b> — ${g.leader}
      <div class="muted">獎勵：${g.badge}、₽${g.reward}<br>隊伍：${team}</div></div>${action}</div>`;
  }).join("");
}

function viewCenter() {
  return `<div class="panel"><h2>🏥 寶可夢中心</h2><p>歡迎來到寶可夢中心！我們可以免費幫你的寶可夢恢復健康。</p>
    ${btn("讓寶可夢休息一下", "heal", [], {cls: "primary"})}</div>`;
}

function viewShop() {
  let h = `<h2>🛒 友好商店</h2>`;
  for (const [item, price] of Object.entries(SHOP)) {
    h += `<div class="panel row"><div class="grow"><b>${item}</b> ₽${price}　<span class="muted">持有 ${G.bag[item] || 0}</span>
      <div class="muted">${SHOP_DESC[item]}</div></div>
      ${btn("買 1", "buy", [item, 1], {disabled: G.money < price})}${btn("買 5", "buy", [item, 5], {disabled: G.money < price * 5})}</div>`;
  }
  if (G.bag["大師球"]) h += `<div class="panel">🟣 大師球 ×${G.bag["大師球"]}（必定捕捉成功）</div>`;
  return h;
}

function viewParty() {
  let h = `<h2>🎒 我的隊伍</h2>`;
  G.party.forEach((m, i) => {
    const s = stats(m);
    let acts = "";
    if (i > 0) acts += btn("設為首發", "lead", [i], {cls: "full"});
    if (G.party.length > 1) acts += btn("存入電腦", "dep", [i], {cls: "full"});
    for (const item of HEAL_ITEMS) if ((G.bag[item] || 0) > 0) acts += btn(`用${item} (${G.bag[item]})`, "use", [item, i], {cls: "full"});
    h += `<div class="panel row wrap-row">${img(SPRITE(m.sid), "", 80)}
      <div class="grow" style="min-width:180px">${monHeader(m)}
        <div class="muted">攻擊 ${s.atk}｜防禦 ${s.def}｜速度 ${s.spd}｜EXP ${m.xp}/${xpNeed(m.lvl)}</div>
        <div class="muted">招式：${m.moves.join("、")}</div></div>
      <div style="display:flex;flex-direction:column;gap:6px;min-width:120px">${acts}</div></div>`;
  });
  return h;
}

function viewBox() {
  let h = `<h2>💻 電腦箱</h2>`;
  if (!G.box.length) return h + `<p class="muted">電腦箱裡空空的。隊伍滿 6 隻後抓到的寶可夢會送到這裡。</p>`;
  G.box.forEach((m, i) => {
    h += `<div class="panel row">${img(SPRITE(m.sid), "", 56)}<div class="grow"><b>${nm(m)}</b> Lv.${m.lvl}<br>${typeBadges(tp(m))}</div>
      ${btn("領出", "wd", [i], {disabled: G.party.length >= 6})}${btn("放生", "rel", [i])}</div>`;
  });
  return h;
}

function viewDex() {
  let h = `<h2>📖 圖鑑　<span class="muted">已見 ${G.seen.length}／已捕捉 ${G.caught.length}／共 ${SPECIES_IDS.length}</span></h2><div class="dex">`;
  for (const sid of SPECIES_IDS) {
    const no = String(sid).padStart(3, "0");
    if (G.seen.includes(sid)) {
      h += `<div class="panel">${img(SPRITE(sid), "", 72)}<div class="muted">${G.caught.includes(sid) ? "✅" : "👁️"} No.${no}</div><b>${SPECIES[sid].name}</b></div>`;
    } else {
      h += `<div class="panel"><span class="unk">❓</span><div class="muted">No.${no}</div><b>？？？</b></div>`;
    }
  }
  return h + `</div>`;
}

function viewSave() {
  return `<div class="panel"><h2>💾 存檔</h2>
    <p>✅ 遊戲進度會<b>自動儲存</b>在這台電腦的瀏覽器裡，關掉再打開會接著玩。</p>
    <p class="muted">想換到其他電腦玩，或是怕清除瀏覽器資料後進度不見，可以下載存檔檔案備份。</p>
    <div class="row wrap-row">${btn("⬇️ 下載存檔", "exportSave", [], {cls: "primary"})}${btn("⬆️ 讀取存檔檔案", "importSave")}</div></div>
    <div class="panel">${btn("🗑️ 重新開始新遊戲", "reset")}</div>`;
}

const footer = () => `<p class="muted footer">非官方粉絲作品，僅供學習交流。Pokémon © Nintendo / Creatures / GAME FREAK。圖片來源：PokeAPI。</p>`;

render();
</script>
</body>
</html>
